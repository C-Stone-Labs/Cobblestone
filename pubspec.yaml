name: cobblestone
description: "Cobblestone — reklamsız, çevrimdışı yerel MP3 çalar."
publish_to: 'none'

version: 5.1.3+55

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: 10.3.10
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo.png
    - assets/icon/stone.jpg

